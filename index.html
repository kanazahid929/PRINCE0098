<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel with Custom Data Builder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --input-bg: rgba(255, 255, 255, 0.05);
            --bg-color: #0f172a;
            --text-color: #f8fafc;
        }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); padding: 20px; }
        .admin-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-tab { background: rgba(255,255,255,0.1); border: none; color: white; padding: 10px 15px; cursor: pointer; border-radius: 8px; }
        .admin-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .admin-section { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; }
        .admin-section[style*="grid-column"] { grid-column: span 2; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; }
        .form-group input { width: 100%; padding: 10px; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; box-sizing: border-box; }
        .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th, .admin-table td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .dl-box { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; margin-top: 20px; max-width: 500px; }
        .dl-btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Admin Navigation -->
    <div class="admin-nav">
        <button class="nav-tab" onclick="switchTab('customData')"><i class="fas fa-database"></i> Custom Data Builder</button>
    </div>

    <!-- Admin Panel Container -->
    <div id="adminPanel">
        <div id="customDataTab" class="admin-content">
            <div class="admin-section">
                <h3><i class="fas fa-plus-circle"></i> Create Data Collection Field</h3>
                <div class="form-group">
                    <label>Field Name / Label (e.g., Name, Phone, Secret Code)</label>
                    <input type="text" id="customFieldName" placeholder="Enter field label...">
                </div>
                <button class="btn btn-primary" onclick="addCustomFieldConfig()" style="margin-top:15px;">
                    <i class="fas fa-plus"></i> Add Field to Form
                </button>
            </div>

            <div class="admin-section">
                <h3><i class="fas fa-list"></i> Form Builder Preview & User Input Form</h3>
                <div id="builderFieldsPreview" style="margin-bottom:20px; padding:15px; background:var(--input-bg); border-radius:15px;"></div>
                <button class="btn btn-success" onclick="saveCustomFormConfig()">
                    <i class="fas fa-save"></i> Publish Form for Users
                </button>
            </div>

            <div class="admin-section" style="grid-column: span 2;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3><i class="fas fa-eye"></i> Submissions View</h3>
                    <button class="btn btn-primary" onclick="loadCustomSubmissions()">
                        <i class="fas fa-sync"></i> 1-Click Refresh Submissions
                    </button>
                </div>
                <div class="admin-table-container" style="margin-top:15px;">
                    <table class="admin-table">
                        <thead>
                            <tr id="subTableHeaders"><th>Time</th><th>Data</th></tr>
                        </thead>
                        <tbody id="subTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- User-Facing Submission View Box -->
    <div class="dl-box" id="userCustomFormBox">
        <h3 style="font-size:1rem;color:var(--primary);margin-bottom:15px;font-weight:900">
            <i class="fas fa-wpforms"></i> Elite Custom Submission
        </h3>
        <div id="userDynamicFormFields"></div>
        <button class="dl-btn" onclick="submitCustomUserData()">
            <i class="fas fa-paper-plane"></i> SUBMIT DATA
        </button>
    </div>

    <script>
        // Mock firebase database reference setup (Replace with your actual Firebase init `firebase.database()`)
        const db = window.db || {
            data: { customForm: { schema: [], submissions: {} } },
            ref: function(path) {
                const parts = path.split('/');
                return {
                    set: (val) => { let ref = db.data; for(let i=0;i<parts.length-1;i++) ref=ref[parts[i]]; ref[parts[parts.length-1]]=val; return Promise.resolve(); },
                    once: (type, cb) => { let ref = db.data; parts.forEach(p => ref = ref ? ref[p] : null); cb({ val: () => ref }); },
                    push: (val) => { const id = 'sub_' + Date.now(); db.data.customForm.submissions[id] = val; return Promise.resolve(); }
                };
            }
        };

        let dynamicFields = [];
        let currentUser = 'TestUser'; // Replace with actual current user variable

        function showNotification(msg, type='info') {
            console.log(`[${type.toUpperCase()}] ${msg}`);
            alert(msg);
        }

        function switchTab(tabId) {
            // Tab switching logic here if you have multiple tabs
        }

        function addCustomFieldConfig() {
            const val = document.getElementById('customFieldName').value.trim();
            if (!val) return showNotification('⚠️ Enter field name first!', 'error');
            dynamicFields.push(val);
            document.getElementById('customFieldName').value = '';
            renderBuilderPreview();
            showNotification('➕ Field added to builder preview');
        }

        function renderBuilderPreview() {
            const container = document.getElementById('builderFieldsPreview');
            container.innerHTML = dynamicFields.map((f, i) => `
                <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid rgba(255,255,255,0.1);">
                    <span><b>${i+1}.</b> ${f}</span>
                    <button onclick="removeBuilderField(${i})" style="background:none; border:none; color:var(--danger); cursor:pointer;"><i class="fas fa-trash"></i></button>
                </div>
            `).join('') || '<p style="opacity:0.6;">No fields added yet.</p>';
        }

        function removeBuilderField(index) {
            dynamicFields.splice(index, 1);
            renderBuilderPreview();
        }

        function saveCustomFormConfig() {
            db.ref('customForm/schema').set(dynamicFields).then(() => {
                showNotification('🚀 Custom form published to users!');
                syncUserFormRendering();
            });
        }

        function syncUserFormRendering() {
            db.ref('customForm/schema').once('value', snap => {
                const fields = snap.val() || [];
                const userContainer = document.getElementById('userDynamicFormFields');
                if (!userContainer) return;
                userContainer.innerHTML = fields.map(f => `
                    <div style="margin-bottom:12px;">
                        <label style="display:block; font-size:0.75rem; color:var(--primary); margin-bottom:5px;">${f}</label>
                        <input type="text" class="custom-user-input" data-label="${f}" placeholder="Enter ${f}..." style="width:100%; padding:10px; background:var(--input-bg); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px; box-sizing:border-box;">
                    </div>
                `).join('');
            });
        }
        
        // Run on load
        syncUserFormRendering();

        function submitCustomUserData() {
            const inputs = document.querySelectorAll('.custom-user-input');
            const submission = { timestamp: new Date().toISOString(), user: currentUser || 'Anonymous' };
            inputs.forEach(input => {
                submission[input.getAttribute('data-label')] = input.value.trim();
            });
            
            db.ref('customForm/submissions').push(submission).then(() => {
                showNotification('✅ Data submitted straight to admin panel!', 'success');
                inputs.forEach(i => i.value = '');
            });
        }

        function loadCustomSubmissions() {
            db.ref('customForm/submissions').once('value', snap => {
                const data = snap.val();
                const tbody = document.getElementById('subTableBody');
                const headersRow = document.getElementById('subTableHeaders');
                tbody.innerHTML = '';
                
                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="2">No submissions yet.</td></tr>';
                    return;
                }
                
                const items = Object.values(data);
                const keysSet = new Set(['Time', 'User']);
                items.forEach(item => Object.keys(item).forEach(k => { if(k !== 'timestamp' && k !== 'user') keysSet.add(k); }));
                const keys = Array.from(keysSet);
                
                headersRow.innerHTML = keys.map(k => `<th>${k}</th>`).join('');
                
                items.reverse().forEach(item => {
                    const tr = document.createElement('tr');
                    keys.forEach(k => {
                        const td = document.createElement('td');
                        if (k === 'Time') td.innerText = new Date(item.timestamp).toLocaleString();
                        else if (k === 'User') td.innerText = item.user;
                        else td.innerText = item[k] || '-';
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                showNotification('⚡ Submissions synced 1-click view!');
            });
        }
    </script>
</body>
</html>
