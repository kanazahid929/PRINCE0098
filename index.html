<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Sheikh Prince | ELITE LEGENDARY</title>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

<style>
:root{
--primary:#00d2ff;
--accent:#008cff;
--bg:#020b1a; 
--card:#0a192f;
--text:#ffffff;
--glass:rgba(255,255,255,.06);
--gradient:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
--danger:#ff416c;
--success:#25D366;
--warning:#ffa726;
--rain-bg: linear-gradient(to bottom, #020b1a, #051937);
--drop-color: var(--primary);
--card-bg: linear-gradient(135deg, rgba(10,25,47,0.95) 0%, rgba(5,15,30,0.95) 100%);
--info-bg: rgba(255,255,255,0.03);
--info-border: rgba(255,255,255,0.1);
--value-color: #ffffff;
--label-opacity: 0.7;
--footer-bg: rgba(0,0,0,0.3);
--footer-border: rgba(255,255,255,0.1);
--mikasa-bg: linear-gradient(135deg, rgba(0,210,255,0.15), transparent);
--dl-bg: rgba(0,0,0,0.3);
--popup-bg: rgba(2, 11, 26, 0.98);
--input-bg: rgba(0, 0, 0, 0.3);
--input-color: #fff;
--admin-bg: linear-gradient(135deg, rgba(2,11,26,0.98) 0%, rgba(5,25,55,0.98) 100%);
--admin-container-bg: linear-gradient(135deg, rgba(10,25,47,0.95) 0%, rgba(5,15,30,0.95) 100%);
--admin-header-bg: rgba(0, 0, 0, 0.4);
--admin-nav-bg: rgba(0, 0, 0, 0.3);
--stat-bg: rgba(0, 0, 0, 0.3);
--table-header-bg: rgba(0, 210, 255, 0.2);
--table-border: rgba(255, 255, 255, 0.1);
--panel-bg: #0a192f;
--story-card-bg: rgba(255,255,255,0.05);
--visitor-bg: rgba(0,210,255,0.08);
--visitor-border: rgba(0,210,255,0.2);
--theme-btn-bg: rgba(255, 255, 255, 0.1);
--theme-btn-border: var(--primary);
--notification-bg: #0a192f;
}

/* ===== LIGHT MODE ===== */
body.light{
--bg:#e8edf5;
--card:#ffffff;
--text:#1a1a2e;
--glass:rgba(0,0,0,.06);
--rain-bg: linear-gradient(to bottom, #c8dff0, #dce9f5);
--drop-color: rgba(0, 140, 200, 0.25);
--card-bg: linear-gradient(135deg, rgba(255,255,255,0.97) 0%, rgba(240,248,255,0.97) 100%);
--info-bg: rgba(0,140,255,0.04);
--info-border: rgba(0,140,255,0.15);
--value-color: #1a1a2e;
--label-opacity: 0.55;
--footer-bg: rgba(0,140,255,0.06);
--footer-border: rgba(0,140,255,0.15);
--mikasa-bg: linear-gradient(135deg, rgba(0,210,255,0.08), rgba(0,140,255,0.03));
--dl-bg: rgba(0,140,255,0.06);
--popup-bg: rgba(200,220,240,0.92);
--input-bg: rgba(255, 255, 255, 0.85);
--input-color: #1a1a2e;
--admin-bg: linear-gradient(135deg, rgba(220,230,245,0.98) 0%, rgba(200,220,240,0.98) 100%);
--admin-container-bg: linear-gradient(135deg, rgba(255,255,255,0.97) 0%, rgba(240,248,255,0.97) 100%);
--admin-header-bg: rgba(255, 255, 255, 0.85);
--admin-nav-bg: rgba(255, 255, 255, 0.7);
--stat-bg: rgba(0, 140, 255, 0.05);
--table-header-bg: rgba(0, 140, 255, 0.1);
--table-border: rgba(0, 0, 0, 0.08);
--panel-bg: #ffffff;
--story-card-bg: rgba(0,140,255,0.04);
--visitor-bg: rgba(0,210,255,0.06);
--visitor-border: rgba(0,210,255,0.2);
--theme-btn-bg: rgba(255,255,255,0.75);
--theme-btn-border: var(--primary);
--notification-bg: #ffffff;
--primary:#0099cc;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif;transition:background .4s, color .4s, border-color .4s, box-shadow .4s}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* ===== RAIN SYSTEM ===== */
.rain-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    background: var(--rain-bg);
    transition: background 0.6s;
}

/* ===== FLOATING PARTICLES ===== */
.particle {
    position: fixed;
    border-radius: 50%;
    background: var(--primary);
    animation: floatUp linear infinite;
    z-index: 0;
    opacity: 0.25;
    transition: background 0.4s;
}

@keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.25; }
    90% { opacity: 0.25; }
    100% { transform: translateY(-20px) rotate(360deg); opacity: 0; }
}

/* ===== POPUPS ===== */
#adminLoginPopup, #namePopup { 
    position: fixed; 
    inset: 0; 
    background: var(--popup-bg); 
    z-index: 9999; 
    display: none; 
    align-items: center; 
    justify-content: center; 
    backdrop-filter: blur(25px); 
}
.popup-card { 
    background: var(--card); 
    padding: 40px; 
    border-radius: 30px; 
    border: 2px solid var(--primary); 
    text-align: center; 
    width: 90%; 
    max-width: 400px; 
    box-shadow: 0 20px 60px rgba(0, 210, 255, 0.4),
                0 0 100px rgba(0, 210, 255, 0.1) inset;
    animation: popupGlow 2s infinite alternate;
    position: relative;
    z-index: 10000;
}
@keyframes popupGlow {
    from { box-shadow: 0 20px 60px rgba(0, 210, 255, 0.4); }
    to { box-shadow: 0 20px 80px rgba(0, 210, 255, 0.6); }
}

input { 
    width: 100%; 
    padding: 15px; 
    margin: 15px 0; 
    border-radius: 15px; 
    border: 2px solid var(--primary); 
    background: var(--input-bg); 
    color: var(--input-color); 
    text-align: center; 
    outline: none; 
    font-size: 1rem;
    transition: all 0.3s;
}
input:focus {
    border-color: #00ffaa;
    box-shadow: 0 0 20px rgba(0, 255, 170, 0.3);
}
input::placeholder {
    color: var(--text);
    opacity: 0.45;
}

/* ===== ADMIN ICON ===== */
.admin-icon {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 9999;
    box-shadow: 0 10px 30px rgba(245, 87, 108, 0.6),
                0 0 0 2px white;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.admin-icon:hover {
    transform: scale(1.1) rotate(10deg);
    box-shadow: 0 15px 40px rgba(245, 87, 108, 0.8),
                0 0 0 3px white,
                0 0 50px rgba(245, 87, 108, 0.4);
}

.admin-icon i {
    color: white;
    font-size: 1.4rem;
    text-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

.admin-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: linear-gradient(135deg, #00d2ff, #008cff);
    color: white;
    font-size: 0.7rem;
    font-weight: 900;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0, 140, 255, 0.4);
    border: 2px solid white;
}

/* ===== THEME & STORY ICONS ===== */
.theme,.story{ 
    position:fixed;
    width:55px;
    height:55px; 
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center; 
    cursor:pointer;
    z-index:999;
    background: var(--theme-btn-bg);
    backdrop-filter: blur(10px);
    border: 2px solid var(--theme-btn-border);
    box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3);
    transition: all 0.3s;
}
.theme i, .story i {
    color: var(--text);
    transition: color 0.4s;
}
.theme:hover,.story:hover {
    transform: scale(1.1);
    box-shadow: 0 15px 40px rgba(0, 210, 255, 0.5);
}
.theme{top:20px;right:20px;}
.story{bottom:20px;left:20px;background:var(--primary);color:#000;}
.story i { font-size: 1.3rem; color: #000 !important; }

/* ===== SLIDE PANEL ===== */
.panel{
    position:fixed;
    top:0;
    right:-100%;
    width:380px;
    height:100%;
    background:var(--panel-bg);
    padding:30px;
    transition:.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    border-left:3px solid var(--primary);
    z-index:1000;
    overflow-y:auto;
    box-shadow: -20px 0 60px rgba(0,0,0,0.5);
}
.panel.active{right:0}

/* ===== ADMIN PANEL ===== */
#adminPanel {
    position: fixed;
    inset: 0;
    background: var(--admin-bg);
    z-index: 99999;
    display: none;
    backdrop-filter: blur(20px);
    overflow-y: auto;
    padding: 0;
}

.admin-container {
    max-width: 1200px;
    margin: 0 auto;
    background: var(--admin-container-bg);
    min-height: 100vh;
    border-left: 3px solid var(--primary);
    border-right: 3px solid var(--primary);
    box-shadow: 0 0 100px rgba(0, 210, 255, 0.2);
    position: relative;
    overflow: hidden;
}

.admin-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--primary), #ff00ff, var(--primary));
    z-index: 1;
}

.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 25px 30px;
    background: var(--admin-header-bg);
    border-bottom: 3px solid var(--primary);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
}

.admin-nav {
    display: flex;
    gap: 15px;
    overflow-x: auto;
    padding: 20px 30px;
    background: var(--admin-nav-bg);
    border-bottom: 2px solid rgba(0, 210, 255, 0.2);
    scrollbar-width: none;
}

.admin-nav::-webkit-scrollbar { display: none; }

.nav-tab {
    padding: 12px 25px;
    background: transparent;
    border: 2px solid var(--primary);
    border-radius: 15px;
    color: var(--text);
    cursor: pointer;
    font-weight: 700;
    font-size: 0.9rem;
    white-space: nowrap;
    transition: all 0.3s;
}

.nav-tab:hover {
    background: rgba(0, 210, 255, 0.2);
    transform: translateY(-2px);
}

.nav-tab.active {
    background: var(--primary);
    color: #000;
    box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4);
}

.admin-content {
    padding: 30px;
    display: grid;
    gap: 25px;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
}

.admin-section {
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(0,210,255,0.05) 100%);
    border-radius: 25px;
    padding: 25px;
    border: 2px solid rgba(0, 210, 255, 0.2);
    backdrop-filter: blur(10px);
    transition: all 0.3s;
}

.admin-section:hover {
    border-color: var(--primary);
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(0, 210, 255, 0.2);
}

.admin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 15px;
}

.stat-card {
    background: var(--stat-bg);
    border-radius: 20px;
    padding: 20px;
    border: 2px solid rgba(0, 210, 255, 0.1);
    text-align: center;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
}

.stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary), transparent);
}

.stat-card:hover {
    border-color: var(--primary);
    transform: translateY(-3px);
}

.stat-card h4 {
    color: var(--primary);
    margin-bottom: 10px;
    font-size: 0.9rem;
    font-weight: 700;
}

.stat-value {
    font-size: 2.5rem;
    font-weight: 900;
    background: linear-gradient(90deg, var(--primary), var(--text));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 10px 0;
}

.stat-change {
    font-size: 0.8rem;
    padding: 4px 10px;
    border-radius: 10px;
    display: inline-block;
    font-weight: 700;
}

.positive { background: rgba(37, 211, 102, 0.2); color: #25D366; }
.negative { background: rgba(255, 65, 108, 0.2); color: #ff416c; }

/* ===== ADMIN TABLE ===== */
.admin-table-container {
    max-height: 300px;
    overflow-y: auto;
    margin-top: 15px;
    border-radius: 15px;
    border: 2px solid rgba(0, 210, 255, 0.2);
    background: var(--stat-bg);
}

.admin-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
}

.admin-table th {
    position: sticky;
    top: 0;
    background: var(--table-header-bg);
    backdrop-filter: blur(10px);
    color: var(--primary);
    font-weight: 900;
    padding: 15px;
    text-align: left;
    border-bottom: 3px solid var(--primary);
}

.admin-table td {
    padding: 12px 15px;
    border-bottom: 1px solid var(--table-border);
}

.admin-table tr:hover {
    background: rgba(0, 210, 255, 0.08);
}

/* ===== FORM ELEMENTS ===== */
.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    color: var(--primary);
    margin-bottom: 8px;
    font-weight: 700;
    font-size: 0.9rem;
}

textarea, select {
    width: 100%;
    padding: 15px;
    border-radius: 15px;
    border: 2px solid rgba(0, 210, 255, 0.3);
    background: var(--input-bg);
    color: var(--input-color);
    font-size: 0.9rem;
    outline: none;
    transition: all 0.3s;
    font-family: 'Outfit', sans-serif;
}

textarea:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
}

/* ===== BUTTONS ===== */
.btn {
    padding: 14px 28px;
    border-radius: 15px;
    border: none;
    cursor: pointer;
    font-weight: 900;
    font-size: 0.9rem;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
}

.btn:active {
    transform: translateY(0);
}

.btn-primary {
    background: linear-gradient(135deg, var(--primary), #008cff);
    color: black;
}

.btn-success {
    background: linear-gradient(135deg, #25D366, #00a352);
    color: white;
}

.btn-danger {
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: white;
}

.btn-warning {
    background: linear-gradient(135deg, #ffa726, #ff9800);
    color: black;
}

.btn-dark {
    background: linear-gradient(135deg, #2d3748, #1a202c);
    color: white;
}

.btn-outline {
    background: transparent;
    border: 2px solid var(--primary);
    color: var(--primary);
}

/* ===== BADGES ===== */
.badge {
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 900;
    display: inline-block;
    margin: 0 5px;
}

.badge-primary { background: rgba(0, 210, 255, 0.2); color: var(--primary); border: 1px solid var(--primary); }
.badge-success { background: rgba(37, 211, 102, 0.2); color: #25D366; border: 1px solid #25D366; }
.badge-danger { background: rgba(255, 65, 108, 0.2); color: #ff416c; border: 1px solid #ff416c; }
.badge-warning { background: rgba(255, 167, 38, 0.2); color: #ffa726; border: 1px solid #ffa726; }

/* ===== MAIN CARD ===== */
.wrap{max-width:540px;margin:130px auto 50px;padding:20px; position: relative; z-index: 1;}
.card{
    background: var(--card-bg);
    border-radius:40px;
    padding:50px 28px 40px;
    text-align:center;
    box-shadow:0 50px 150px rgba(0,0,0,.8),
               0 0 0 1px rgba(0,210,255,0.2),
               0 0 100px rgba(0,210,255,0.1) inset;
    position:relative;
    backdrop-filter: blur(20px);
    border: 2px solid rgba(0,210,255,0.3);
}
.avatarBox { 
    position: absolute; 
    top: -80px; 
    left: 50%; 
    transform: translateX(-50%); 
    width: 160px; 
    height: 160px; 
    z-index: 10; 
}
.avatar { 
    width: 100%; 
    height: 100%; 
    border-radius: 50%; 
    object-fit: cover; 
    border: 5px solid var(--primary); 
    box-shadow: 0 0 50px var(--primary),
                0 0 100px rgba(0,210,255,0.5) inset; 
    animation: avatarGlow 3s infinite alternate;
}
@keyframes avatarGlow {
    from { box-shadow: 0 0 50px var(--primary); }
    to { box-shadow: 0 0 70px var(--primary), 0 0 100px rgba(0,210,255,0.7) inset; }
}

h1{
    margin-top:45px;
    font-size:2rem;
    font-weight:900;
    background:linear-gradient(90deg, var(--primary), #fff, var(--primary));
    background-size: 200% auto;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip: text;
    animation: shine 3s linear infinite;
}
body.light h1 {
    background: linear-gradient(90deg, #0077aa, #1a1a2e, #0077aa);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shine 3s linear infinite;
}
@keyframes shine {
    to { background-position: 200% center; }
}

.profile-badge{
    margin:10px 0;
    padding:8px 22px;
    border-radius:50px;
    font-size:.8rem;
    font-weight:900;
    border:2px solid var(--primary);
    background:rgba(0,210,255,.15);
    display:inline-block;
    backdrop-filter: blur(10px);
    color: var(--text);
}

.section-title { 
    font-size: 0.9rem; 
    color: var(--primary); 
    font-weight: 900; 
    text-transform: uppercase; 
    margin: 30px 0 15px; 
    text-align: left; 
    border-left: 4px solid var(--primary); 
    padding-left: 15px; 
    letter-spacing: 2px;
}
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    text-align:left
}
.info{
    background:var(--info-bg);
    padding:15px;
    border-radius:15px;
    border:1px solid var(--info-border);
    transition: all 0.3s;
}
.info:hover {
    border-color: var(--primary);
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0, 210, 255, 0.1);
}
.info i{
    color:var(--primary);
    margin-right:10px;
    font-size: 0.9rem;
}
.label{
    display:block;
    font-size:.6rem;
    opacity:var(--label-opacity);
    font-weight:900;
    letter-spacing: 1px;
    margin-bottom: 5px;
    color: var(--text);
}
.value{
    font-size:.8rem;
    font-weight:700;
    color: var(--value-color);
}

/* ===== MIKASA ===== */
.mikasa{
    margin-top:25px;
    padding:25px;
    border-radius:25px;
    background:var(--mikasa-bg);
    border:2px solid var(--primary);
    text-align:left;
    backdrop-filter: blur(10px);
}
.mikasaHead{
    display:flex;
    gap:15px;
    align-items:center;
    margin-bottom:15px
}
.mikasaHead img{
    width:60px;
    height:60px;
    border-radius:50%;
    border:3px solid var(--primary);
    box-shadow: 0 0 30px var(--primary);
}
.mikasa p{
    font-size:.8rem;
    line-height:1.6;
    opacity:0.9;
    margin-bottom: 15px;
    color: var(--text);
}

/* ===== DOWNLOADER ===== */
.dl-box { 
    margin-top: 30px; 
    padding: 25px; 
    background: var(--dl-bg); 
    border-radius: 25px; 
    border: 2px solid var(--primary);
    backdrop-filter: blur(10px);
}
.dl-btn { 
    width: 100%; 
    padding: 15px; 
    border-radius: 15px; 
    border: none; 
    background: linear-gradient(135deg, var(--primary), #008cff);
    color: #000; 
    font-weight: 900; 
    cursor: pointer; 
    font-size: 1rem;
    letter-spacing: 1px;
    transition: all 0.3s;
}
.dl-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0, 210, 255, 0.4);
}

/* ===== SOCIAL ===== */
.social{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:25px
}
.social a{
    height:50px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
